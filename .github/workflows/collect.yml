# Manual backup: refresh the 511 data on the deployed app (Trip Check), then
# collect road condition snapshots (Phase 9). Actions → Collect → Run
# workflow.
#
# The 15-minute schedule now runs in Supabase (pg_cron + pg_net, see
# supabase/cron.sql). GitHub's schedule ran only every few hours for this
# repo, so it was dropped here to keep runs from doubling up. Setup
# (secrets, variables): see TODO.md.
name: Collect

on:
  workflow_dispatch:

permissions:
  contents: read

# Never two runs at once (511's rate limit, and one snapshot per camera).
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Each step runs only once its settings exist, so the schedule stays
      # quiet (no failure emails) until setup is done. Secrets themselves are
      # given only to the step that uses them, never to `npm ci` (which runs
      # dependencies' install scripts).
      CAN_SYNC: ${{ vars.APP_URL != '' && secrets.CRON_SECRET != '' }}
      CAN_COLLECT: ${{ secrets.DATABASE_URL != '' && secrets.S3_BUCKET != '' }}
    steps:
      - name: Refresh 511 data on the app (Trip Check)
        if: env.CAN_SYNC == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/sync" \
            | jq -c '{trip: .trip.status, alerts: .alerts, ms: .durationMs}'

      # Actions are pinned to full commit SHAs (tags can be moved).
      - name: Checkout
        if: env.CAN_COLLECT == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: env.CAN_COLLECT == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: env.CAN_COLLECT == 'true'
        run: npm ci --no-audit --no-fund

      - name: Collect snapshots
        if: env.CAN_COLLECT == 'true'
        run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
