# CodeQL static analysis for the TypeScript/JavaScript code and for these
# workflow files. Results show up under the repo's Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "27 6 * * 1" # Mondays 06:27 UTC, to catch newly added queries

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # upload results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
