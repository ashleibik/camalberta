# Lint, typecheck, format check, unit tests and Playwright smoke tests on every
# push and pull request, plus the production dependency audit (fails on high
# or critical).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck, format and tests
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Playwright smoke tests (Trip Check). Runs the dev server against an
    # empty local database; the content checks replay a saved 511 report.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # A throwaway value for this short-lived test server only, so the
          # signed-in admin checks run too. Not a real secret.
          CRON_SECRET: ci-only-throwaway-admin-secret-0000000000
