# Lint, typecheck, format check, unit tests and Playwright smoke tests on every
# push and pull request, plus the production dependency audit (fails on high
# or critical).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck, format and tests
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Playwright smoke tests (Trip Check). Runs the dev server against an
    # empty local database; the content checks replay a saved 511 report.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Push alerts on, like production: a fresh VAPID key pair generated for
      # this run only (never committed, gone when the job ends). The private
      # key is masked in the logs.
      - name: Throwaway push keys for this run
        run: |
          node -e '
            const { generateVAPIDKeys } = require("web-push")
            const keys = generateVAPIDKeys()
            console.log("::add-mask::" + keys.privateKey)
            require("node:fs").appendFileSync(
              process.env.GITHUB_ENV,
              `VAPID_PUBLIC_KEY=${keys.publicKey}\n` +
                `VAPID_PRIVATE_KEY=${keys.privateKey}\n` +
                "VAPID_SUBJECT=mailto:ci@example.com\n"
            )
          '

      # A throwaway admin login for this run only: a random password for the
      # tests and its scrypt hash for the server (which never sees the
      # password). Masked in the logs, gone when the job ends.
      - name: Throwaway admin login for this run
        run: |
          PASSWORD=$(node -e 'console.log(require("crypto").randomBytes(24).toString("base64url"))')
          echo "::add-mask::$PASSWORD"
          HASH=$(printf '%s' "$PASSWORD" | npm run -s admin:hash)
          {
            echo "E2E_ADMIN_PASSWORD=$PASSWORD"
            echo "ADMIN_PASSWORD_HASH=$HASH"
          } >> "$GITHUB_ENV"

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          ADMIN_USERNAME: ci-admin
