# Lint, typecheck, format check, unit tests and Playwright smoke tests on every
# push and pull request, plus the production dependency audit (fails on high
# or critical).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck, format and tests
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Playwright smoke tests (Trip Check). Runs the dev server against an
    # empty local database; the content checks replay a saved 511 report.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # Throwaway values for this short-lived test server only, so the
          # signed-in admin checks run too. Not real credentials.
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-only-throwaway-admin-password
